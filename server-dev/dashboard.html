<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Battery health monitoring system</title>
<style>
:root{--bg:#f1f3f2;--card:#fff;--tx:#14201c;--mu:#5d6b66;--ln:#dfe4e2;--ok:#1b8a52;--wa:#b87400;--wn:#d9590b;--cr:#c62f2f;--c12:#b87400;--c36:#0f8577;--c48:#5b45c9;--cct:#c2185b;--dk:#14201c;--lo:#2f6fd6;--hi:#d63c2f}
@media(prefers-color-scheme:dark){:root{--bg:#0f1513;--card:#192320;--tx:#e8efec;--mu:#9aaba5;--ln:#2a3833;--ok:#3fcf86;--wa:#e0a030;--wn:#f08a4b;--cr:#ef6b6b;--c12:#e0a030;--c36:#3cc5b3;--c48:#9d8cf5;--cct:#f06292;--dk:#e8efec;--lo:#5b9bff;--hi:#ff6b5b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:1280px;margin:0 auto;padding:20px}
h1{font-size:24px;margin:0}h2{font-size:15px;margin:0 0 4px}.mu{color:var(--mu)}.sm{font-size:12px}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.pill{border:1px solid var(--ln);background:var(--card);border-radius:99px;padding:4px 12px;font-weight:600;font-size:12px;display:inline-flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mu)}.dot.on{background:var(--ok)}.dot.bad{background:var(--cr)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tab{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 14px;font:inherit;font-weight:600;cursor:pointer}
.tab.on{background:var(--dk);color:var(--bg);border-color:var(--dk)}
.badge{background:var(--cr);color:#fff;border-radius:99px;padding:0 6px;font-size:11px;margin-left:4px}
.g{display:grid;gap:12px}.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}.g6{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.c{background:var(--card);border-radius:12px;padding:14px 16px;margin-bottom:12px;overflow-x:auto}.g>.c{margin:0}
.kit{cursor:pointer;border:2px solid transparent}.kit.sel{border-color:var(--kc)}
.bar{height:6px;border-radius:4px;background:var(--ln);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%}
.m{border-left:3px solid var(--kc);border-radius:8px;background:var(--card);padding:8px 12px}.m b{font-size:22px;display:block}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--ln);vertical-align:top}th{color:var(--mu);font-weight:600;font-size:12px}
.st{font-weight:700}.Healthy,.healthy,.Good{color:var(--ok)}.Watch{color:var(--wa)}.Warning,.warning{color:var(--wn)}.Critical,.critical,.Replace{color:var(--cr)}.Unknown{color:var(--mu)}
tr.rWatch td{background:color-mix(in srgb,var(--wa) 13%,transparent)}tr.rReplace td{background:color-mix(in srgb,var(--cr) 13%,transparent)}
.ab{font-weight:700;color:var(--cr)}.abw{font-weight:700;color:var(--wa)}
input[type=range]{accent-color:var(--tx)}
table.ft td,table.ft th{padding:4px 6px;font-size:12px;white-space:nowrap}td.lo{color:var(--lo);font-weight:700}td.hi{color:var(--hi);font-weight:700}
tr.pch td{border-top:2px solid var(--mu)}.phs{display:flex;height:16px;border-radius:4px;overflow:hidden;margin:8px 0 2px}.phs i{display:block;height:100%}
ul.sum{margin:6px 0 0;padding-left:18px}ul.sum li{margin:3px 0}
@media print{.tabs,#pill,#toasts,.tb,.noprint{display:none!important}.c{break-inside:avoid}body{background:#fff}}
.chip{border:1px solid var(--ln);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;margin:2px 4px 2px 0;display:inline-block}
.chip.ok{color:var(--ok)}.chip.off{color:var(--mu)}
button.b{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:8px;padding:5px 10px;font:inherit;cursor:pointer}
button.b:hover{border-color:var(--tx)}button.p{background:var(--dk);color:var(--bg)}
.cells{display:flex;gap:4px;align-items:flex-end;height:120px;margin-top:8px}.cells div{flex:1;min-width:6px;border-radius:3px 3px 0 0;position:relative}
.cl{display:flex;gap:4px;font-size:10px;color:var(--mu)}.cl span{flex:1;text-align:center;min-width:6px}
svg{width:100%;height:auto;display:block}
input,select{font:inherit;padding:6px 8px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);width:100%}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 2px}
#toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:9;max-width:340px}
.toast{background:var(--card);border-left:4px solid var(--wn);box-shadow:0 4px 18px #0003;padding:10px 12px;border-radius:8px}
.toast.critical{border-color:var(--cr)}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.tb select{width:auto}
pre{background:var(--bg);padding:10px;border-radius:8px;overflow:auto;font-size:12px;max-height:260px}

/* ---- battery packages tab ---- */
.pk{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-bottom:16px}
.pkc{position:relative;cursor:pointer;border-radius:18px;padding:16px;background:linear-gradient(145deg,color-mix(in srgb,var(--kc) 18%,var(--card)),var(--card) 70%);border:2px solid transparent;overflow:hidden;transition:transform .15s,box-shadow .15s}
.pkc:hover{transform:translateY(-2px)}.pkc.sel{border-color:var(--kc);box-shadow:0 8px 28px color-mix(in srgb,var(--kc) 30%,transparent)}
.pkc .ring{float:right;width:88px;height:88px}
.pkc .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;clear:both}.pkc .kv span{display:block;font-size:11px;color:var(--mu)}.pkc .kv b{font-size:15px}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:5px;animation:pu 1.4s infinite}.live.off{background:var(--cr);animation:none}
@keyframes pu{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.live{animation:none}.pkc{transition:none}}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:99px;background:var(--card);padding:3px;gap:2px}.seg button{border:0;background:none;color:var(--tx);font:inherit;font-weight:600;padding:5px 14px;border-radius:99px;cursor:pointer}.seg button.on{background:var(--kc,var(--dk));color:#fff}
.ct{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(124px,1fr))}
.cell{border-radius:14px;padding:10px 12px;background:var(--bg);border:2px solid var(--ln)}
.cell .vb{height:52px;border-radius:7px;background:var(--ln);position:relative;overflow:hidden;margin:6px 0}.cell .vb i{position:absolute;left:0;right:0;bottom:0;border-radius:0}
.ds{max-height:560px;overflow:auto;border:1px solid var(--ln);border-radius:12px}.ds table{min-width:1250px}.ds th{position:sticky;top:0;background:var(--card);z-index:1;white-space:nowrap}.ds td{white-space:nowrap;font-variant-numeric:tabular-nums}
.ds tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--tx) 3%,transparent)}.ds tr.tot td{font-weight:700;position:sticky;bottom:0;background:var(--card);border-top:2px solid var(--mu)}
.ib{display:inline-block;height:6px;border-radius:3px;vertical-align:middle;margin-left:6px}
/* ---- history: cards + charge/discharge log ---- */
.hxg{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-bottom:12px}
.hxc{border-radius:16px;padding:14px 16px;background:linear-gradient(150deg,color-mix(in srgb,var(--kc) 14%,var(--card)),var(--card) 75%);border:1px solid color-mix(in srgb,var(--kc) 25%,var(--ln))}
.hxt{font-size:12px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.hxb{font-size:30px;font-weight:800;line-height:1.15;margin:6px 0 4px;font-variant-numeric:tabular-nums}.hxb span{font-size:13px;font-weight:600;color:var(--mu);margin-left:4px}
.hxs{font-size:12px;color:var(--mu);margin-top:6px}
.hx2{display:flex;gap:14px;margin-top:6px}.hx2 div{flex:1}.hx2 small{display:block;font-size:11px;color:var(--mu)}.hx2 b{font-size:22px;font-variant-numeric:tabular-nums}
.hp{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;background:color-mix(in srgb,currentColor 14%,transparent)}
.hxw{border:1px solid var(--ln);border-radius:12px;overflow:auto;max-height:520px}
table.hxd{width:auto;min-width:100%;border-collapse:separate;border-spacing:0}
.hxd th,.hxd td{white-space:nowrap;text-align:left;padding:10px 14px;border-bottom:1px solid var(--ln);vertical-align:middle;font-variant-numeric:tabular-nums}
.hxd thead th{position:sticky;top:0;background:var(--card);z-index:2;color:var(--tx);font-size:12px}
.hxd tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--tx) 3%,transparent)}
.hxr{cursor:pointer}.hxr:hover td{background:color-mix(in srgb,var(--kc,var(--c36)) 12%,transparent)!important}
.hxd .hxh td{background:var(--bg)!important;font-size:13px;padding:8px 14px;cursor:default}
</style>
</head>
<body>
<div class="w">
  <div class="top">
    <div><h1>Battery health monitoring system</h1><div class="mu">12 V, 36 V and 48 V LiFePO4 kits monitored through a gateway board and MQTT</div></div>
    <div id="pill"></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</div>
<div id="toasts"></div>

<!-- MQTT over WebSocket client (only needed for live mode) -->
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.3.4/dist/mqtt.min.js"></script>
<script>
/* ============ config & helpers ============ */
const $=s=>document.querySelector(s);
/* ---- CONFIG: edit here or use the URL, e.g. ?mode=mqtt&url=wss://host:9001&user=dash&pass=secret ---- */
const P=new URLSearchParams(location.search);
const CFG={mode:P.get('mode')==='mqtt'?'mqtt':'sim',url:P.get('url')||'ws://localhost:9001',user:P.get('user')||'',pass:P.get('pass')||'',topic:P.get('topic')||'bhm/+/+/telemetry',sound:P.get('sound')==='1'};
const TH={tWarn:45,tCrit:55,dWarn:50,dCrit:150,cLow:3000,cHigh:3650,socWarn:20,socCrit:10,stale:10};
const SRC=CFG.mode==='sim'?'sim':'live';
const RETAIN=7*864e5,SAVE_EVERY=10000;
const COL={kit12v:'--c12',kit36v:'--c36',kit48v:'--c48',chargetest12v:'--cct'};
const NAMES={chargetest12v:'Charge test 12V'};   /* display names; other ids: kit12v -> 12V */
const hhmmss=d=>new Date(d).toLocaleTimeString('en-GB');
const f=(v,n=1)=>v==null||isNaN(v)?'n/a':(+v).toFixed(n);
const ago=t=>{const s=Math.max(0,(Date.now()-t)/1000);return s<90?Math.round(s)+' s':s<5400?Math.round(s/60)+' min':s<172800?Math.round(s/3600)+' h':Math.round(s/86400)+' days'};
const dur=h=>!isFinite(h)||h<=0?'n/a':h>=1?`${Math.floor(h)} h ${Math.round(h%1*60)} min`:`${Math.round(h*60)} min`;
let tab='overview',sel=null,conn='idle',K={},ALARMS=[],HIST=[];

/* ============ database (IndexedDB, persists across reloads) ============ */
let DB=null,RB=[],AB=[];
const idb=new Promise(res=>{try{const r=indexedDB.open('bhm',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('readings',{autoIncrement:true}).createIndex('t','t');d.createObjectStore('alarms',{autoIncrement:true}).createIndex('t','t')};
  r.onsuccess=()=>{DB=r.result;res(DB)};r.onerror=()=>res(null)}catch(e){res(null)}});
function flush(){return new Promise(res=>{if(!DB||(!RB.length&&!AB.length))return res();
  const r=RB.splice(0),a=AB.splice(0),tx=DB.transaction(['readings','alarms'],'readwrite');
  r.forEach(x=>tx.objectStore('readings').add(x));a.forEach(x=>tx.objectStore('alarms').add(x));
  tx.oncomplete=tx.onerror=tx.onabort=()=>res()})}
function scan(store,since,fn){return new Promise(res=>{if(!DB)return res();
  const q=DB.transaction(store).objectStore(store).index('t').openCursor(IDBKeyRange.lowerBound(since),'prev');
  q.onsuccess=()=>{const c=q.result;if(c){fn(c.value);c.continue()}else res()};q.onerror=()=>res()})}
function edge(store,dir){return new Promise(res=>{if(!DB)return res(null);
  const q=DB.transaction(store).objectStore(store).index('t').openCursor(null,dir);q.onsuccess=()=>res(q.result?q.result.value.t:null);q.onerror=()=>res(null)})}
function countAll(store){return new Promise(res=>{if(!DB)return res(0);const q=DB.transaction(store).objectStore(store).count();q.onsuccess=()=>res(q.result);q.onerror=()=>res(0)})}
async function purge(){await idb;if(!DB)return;
  ['readings','alarms'].forEach(st=>{const q=DB.transaction(st,'readwrite').objectStore(st).index('t').openCursor(IDBKeyRange.upperBound(Date.now()-RETAIN));
    q.onsuccess=()=>{const c=q.result;if(c){c.delete();c.continue()}}})}

/* ============ state per kit ============ */
function kit(id){return K[id]||(K[id]={id,label:NAMES[id]||id.replace('kit','').toUpperCase(),last:null,seen:0,lastTs:0,h:[],eIn:0,eOut:0,ahOut:0,peak:0,tSum:0,tN:0,first:Date.now(),dev:[],n:0,cap:0})}

function ingest(m,stored=false){
  if(!m||!m.battery_id||!m.pack||!m.cells||!m.temps)return;
  const k=kit(m.battery_id),p=m.pack,c=m.cells,now=stored?(Date.parse(m.ts)||Date.now()):Date.now();
  const ts=Date.parse(m.ts)||now;
  if(!stored)dayAdd(k,m,ts,k.lastTs&&ts>k.lastTs?Math.min((ts-k.lastTs)/3.6e6,0.1):0);
  if(k.lastTs&&ts>k.lastTs){const dt=Math.min((ts-k.lastTs)/3.6e6,0.1);
    if(p.power_w>0)k.eIn+=p.power_w*dt;else k.eOut+=-p.power_w*dt;
    if(p.current_a<0)k.ahOut+=-p.current_a*dt}
  k.lastTs=ts;k.last=m;k.seen=now;k.n=c.count;
  if(p.soc_pct>5)k.cap=p.remaining_ah/(p.soc_pct/100);
  k.peak=Math.max(k.peak,Math.abs(p.power_w));k.tSum+=m.temps.max_c;k.tN++;
  const avg=c.voltages_mv.reduce((a,b)=>a+b,0)/c.voltages_mv.length;
  c.voltages_mv.forEach((v,i)=>k.dev[i]=(k.dev[i]==null?v-avg:k.dev[i]*.97+(v-avg)*.03));
  k.h.push({t:now,v:p.voltage_v,i:p.current_a,w:p.power_w,soc:p.soc_pct,T:m.temps.max_c,d:c.delta_mv});
  if(k.h.length>240)k.h.shift();
  if(!stored&&now-(k.sv||0)>=SAVE_EVERY){k.sv=now;RB.push({t:now,kit:k.id,label:k.label,src:SRC,v:p.voltage_v,i:p.current_a,w:p.power_w,soc:p.soc_pct,T:m.temps.max_c,d:c.delta_mv})}
  if(!sel)sel=k.id;
  if(!stored)reconcile(k);
}

/* ============ stored data from the server (live mode): the page has data even when the board is offline ============ */
async function backfill(){
  try{const r=await fetch('api/recent?hours=6&limit=240',{credentials:'same-origin',cache:'no-store'});
    if(!r.ok)return;const j=await r.json();
    (j.messages||[]).forEach(m=>ingest(m,true));
    Object.values(K).forEach(k=>{if(k.h.length)k.first=k.h[0].t});
    Object.values(K).forEach(reconcile)}catch(e){}
}

/* ============ health & alarm rules ============ */
function conds(k){
  const o=[],L=(sev,key,title,cause,action)=>o.push({sev,key,title,cause,action});
  const m=k.last;if(!m)return o;
  if(Date.now()-k.seen>TH.stale*1000){L('warning','offline','No data',`Nothing received for over ${TH.stale} s. The gateway, RS485 link or network may be down.`,'Check the gateway service and the USB-RS485 cable.');return o}
  const t=m.temps.max_c,d=m.cells.delta_mv,s=m.pack.soc_pct,c=m.cells;
  if(t>=TH.tCrit)L('critical','temp','High temperature',`Temperature is ${t} C (critical limit ${TH.tCrit}). Likely overload or poor cooling.`,'Stop charge/discharge and cool the pack.');
  else if(t>=TH.tWarn)L('warning','temp','High temperature',`Temperature is ${t} C (limit ${TH.tWarn}). Likely overload or poor cooling.`,'Reduce load or charge rate and improve airflow.');
  if(d>=TH.dCrit)L('critical','imb','Cell imbalance',`Cells differ by ${d} mV (critical ${TH.dCrit}).`,'Stop use, balance-charge and inspect the weakest cell.');
  else if(d>=TH.dWarn)L('warning','imb','Cell imbalance',`Cells differ by ${d} mV (limit ${TH.dWarn}). Likely a weak cell or balancing not completing.`,'Charge fully so the balancer can work, then inspect the weakest cell.');
  if(c.min_mv<=TH.cLow)L('critical','clow','Cell under-voltage',`Cell ${c.min_cell} is at ${c.min_mv} mV (limit ${TH.cLow}). Over-discharge or a weak cell.`,'Stop discharging and recharge gently.');
  if(c.max_mv>=TH.cHigh)L('critical','chigh','Cell over-voltage',`Cell ${c.max_cell} is at ${c.max_mv} mV (limit ${TH.cHigh}).`,'Stop charging and check the charger and balancer.');
  if(s<=TH.socCrit&&m.pack.current_a<0)L('critical','soc','Battery almost empty',`State of charge is ${f(s)} %.`,'Disconnect the load and recharge.');
  else if(s<=TH.socWarn&&m.pack.current_a<0)L('warning','soc','Low charge',`State of charge is ${f(s)} %.`,'Plan a recharge soon.');
  k.dev.forEach((v,i)=>{if(v<-30)L('warning','weak'+i,`Weak cell C${i+1}`,`Cell ${i+1} stays about ${Math.round(-v)} mV below the other cells. Likely an ageing or damaged cell.`,'Test that cell on its own and plan its replacement.')});
  (m.faults||[]).forEach(x=>L('warning','bms_'+x,'BMS fault: '+x.replace(/_/g,' '),'The BMS itself reported this fault.','Check the cell/temperature that tripped it.'));
  return o;
}
const rec=(now,k,ev,c)=>{if(ev==='raised'){const dk=dkey(now),dd=(k.day=k.day||{});(dd[dk]||(dd[dk]=newDay(dk))).alarms++}HIST.unshift({t:now,kit:k.id,ev,title:c.title,sev:c.sev});AB.push({t:now,kit:k.id,label:k.label,ev,title:c.title,sev:c.sev,src:SRC})};
function reconcile(k){
  const now=Date.now(),cs=conds(k),keys=new Set(cs.map(c=>c.key));
  cs.forEach(c=>{if(!ALARMS.find(a=>a.kit===k.id&&a.key===c.key)){
    const a={...c,kit:k.id,since:now,ack:false};ALARMS.push(a);
    rec(now,k,'raised',c);toast(a)}});
  ALARMS=ALARMS.filter(a=>{if(a.kit!==k.id||keys.has(a.key))return true;
    rec(now,k,'cleared',a);return false});
  if(HIST.length>200)HIST.length=200;
}
function health(k){
  const m=k.last;if(!m)return null;
  const d=m.cells.delta_mv,t=m.temps.max_c,fc=(m.faults||[]).length;
  const a=HL[k.id],soh=a?a.soh_pct:null,ps=soh==null?0:Math.min(30,Math.max(0,100-soh));
  const pi=Math.min(20,d*.2),pt=Math.min(15,Math.max(0,t-40)),pf=Math.min(20,fc*5),sc=100-pi-pt-pf-ps;
  const crit=t>55||d>150||sc<50||ALARMS.some(a=>a.kit===k.id&&a.sev==='critical');
  let st=crit?'Critical':sc>=85?'Healthy':sc>=70?'Watch':'Warning';
  if(a&&a.status==='Replace'&&st==='Healthy')st='Watch';
  return{sc,pi,pt,pf,ps,soh,st};
}

/* ============ calculated health and every stored frame (server: api/health, api/frames; method in api/health.py) ============ */
let HL={};
const CST={Good:'--ok',Watch:'--wa',Replace:'--cr',Unknown:'--mu'};
const cellH=(id,n)=>((HL[id]||{}).cell_health||[])[n-1];
const isAb=c=>c&&(c.status==='Watch'||c.status==='Replace');
async function loadHealth(){if(CFG.mode!=='mqtt')return;
  try{const r=await fetch('api/health',{credentials:'same-origin',cache:'no-store'});if(r.ok){HL=(await r.json()).batteries||{};FR.ver++}}catch(e){}}
const FR={id:null,d:null,i:0,ver:0,drawn:'',busy:false,at:0,play:null,img:null,imgKey:''};
async function loadFrames(id){if(CFG.mode!=='mqtt'||FR.busy)return;FR.busy=true;
  try{const r=await fetch('api/frames?battery='+encodeURIComponent(id)+'&hours=6',{credentials:'same-origin',cache:'no-store'});
    if(r.ok){const d=await r.json(),follow=FR.id!==id||!FR.d||FR.i>=FR.d.n-1;FR.d=d;FR.id=id;if(follow)FR.i=d.n-1;FR.ver++}}catch(e){}
  FR.at=Date.now();FR.busy=false;render()}

/* ============ notifications ============ */
function toast(a){
  const e=document.createElement('div');e.className='toast '+a.sev;
  e.innerHTML=`<b>${K[a.kit].label}: ${a.title}</b><div class="sm mu">${a.cause}</div>`;
  $('#toasts').appendChild(e);setTimeout(()=>e.remove(),7000);
  if(a.sev==='critical'&&CFG.sound)try{const x=new(window.AudioContext||window.webkitAudioContext)(),o=x.createOscillator();o.connect(x.destination);o.frequency.value=880;o.start();o.stop(x.currentTime+.25)}catch(e){}

/* ============ simulator (same JSON as the gateway) ============ */
const SPEC={kit12v:{n:4,nom:12.8,cap:100},kit36v:{n:12,nom:38.4,cap:60},kit48v:{n:16,nom:51.2,cap:40}};
const OCV=[[0,2800],[5,3100],[10,3200],[20,3240],[50,3290],[80,3330],[90,3350],[95,3400],[100,3600]];
const ocv=s=>{for(let i=1;i<OCV.length;i++)if(s<=OCV[i][0]){const[a,b]=OCV[i-1],[c,d]=OCV[i];return b+(d-b)*(s-a)/(c-a)}return 3600};
let SIM={},simT=Date.now(),simTimer=null;
function simInit(){simT=Date.now();SIM={};let r=1;
  for(const id in SPEC){const s=SPEC[id];SIM[id]={soc:40+r*18%50,mode:'dis',cycles:40+r*5,T:26,off:Array.from({length:s.n},()=>(Math.random()-.5)*14),weak:Math.floor(Math.random()*s.n),heat:0,offl:0,seq:0,load:5+r*4};r++}}
function simTick(){
  simT+=30000;
  for(const id in SPEC){const s=SPEC[id],x=SIM[id];x.seq++;
    if(x.mode==='dis'&&x.soc<12){x.mode='chg'}else if(x.mode==='chg'&&x.soc>99){x.mode='dis';x.cycles++}
    const sc=s.n/4*.8,I=x.mode==='dis'?-(x.load*sc+Math.random()*3):(x.soc>94?8:20)*sc/2*(1+Math.random()*.1);
    x.soc=Math.min(100,Math.max(0,x.soc+I*30/3600/s.cap*100));
    const target=26+Math.abs(I)*.5+(x.heat>0?30:0);x.T+=(target-x.T)*.08+(Math.random()-.5)*.4;if(x.heat>0)x.heat--;
    x.off[x.weak]-=(x.mode==='dis'?.25:0)*(x.off[x.weak]>-90);
    const v=Array.from({length:s.n},(_,i)=>Math.round(ocv(x.soc)+x.off[i]+I*(i===x.weak?1.8:.9)+(Math.random()-.5)*2));
    const mx=Math.max(...v),mn=Math.min(...v),bal=x.mode==='chg'&&x.soc>90?v.map((a,i)=>a-mn>10?i+1:0).filter(Boolean):[];
    const tt=[Math.round(x.T),Math.round(x.T-1)],pv=v.reduce((a,b)=>a+b,0)/1000,faults=[];
    if(mn<3000)faults.push('cell_volt_low_l1');if(x.T>55)faults.push('temp_high_l2');
    if(x.offl>0){x.offl--;continue}
    ingest({schema:1,site:'lab1',battery_id:id,nominal_voltage:s.nom,chemistry:'LiFePO4',ts:new Date(simT).toISOString(),seq:x.seq,
      pack:{voltage_v:+pv.toFixed(2),current_a:+I.toFixed(2),power_w:Math.round(pv*I),soc_pct:+x.soc.toFixed(1),state:I>.5?'charging':I<-.5?'discharging':'idle',remaining_ah:+(s.cap*x.soc/100).toFixed(2),cycles:x.cycles,charge_mos:true,discharge_mos:true,charger_connected:I>0,load_connected:I<0},
      cells:{count:s.n,voltages_mv:v,max_mv:mx,max_cell:v.indexOf(mx)+1,min_mv:mn,min_cell:v.indexOf(mn)+1,delta_mv:mx-mn,balancing:bal},
      temps:{sensors_c:tt,max_c:Math.max(...tt),min_c:Math.min(...tt)},faults,fault_code:faults.length?1:0});
  }
  Object.values(K).forEach(reconcile);
}
function inject(type,id){const x=SIM[id];if(!x)return;
  if(type==='heat')x.heat=40;if(type==='weak')x.off[x.weak]-=70;if(type==='off')x.offl=15;if(type==='low'){x.soc=9;x.mode='dis'}}

/* ============ live MQTT over WebSocket ============ */
let cli=null;
function connect(){
  if(!window.mqtt){conn='mqtt.js not loaded (check internet / CDN)';return}
  conn='connecting';
  cli=mqtt.connect(CFG.url,{username:CFG.user||undefined,password:CFG.pass||undefined,reconnectPeriod:3000,clientId:'bhm-dash-'+Math.random().toString(16).slice(2,8)});
  cli.on('connect',()=>{conn='connected';cli.subscribe(CFG.topic,{qos:0})});
  cli.on('reconnect',()=>conn='reconnecting');
  cli.on('error',e=>conn='error: '+e.message);
  cli.on('offline',()=>conn='offline');
  cli.on('message',(t,b)=>{if(!t.endsWith('/telemetry'))return;try{const m=JSON.parse(b.toString());
    ingest(m,Date.now()-(Date.parse(m.ts)||Date.now())>60000)}catch(e){}});   /* a backlog upload is old data, not live */
}
function start(){
  clearInterval(simTimer);if(cli){try{cli.end(true)}catch(e){}cli=null}
  K={};ALARMS=[];HIST=[];sel=null;
  if(CFG.mode==='sim'){conn='simulator';simInit();for(let i=0;i<20;i++)simTick();simTimer=setInterval(simTick,1000)}
  else{conn='loading stored data';backfill().finally(connect);loadHealth()}
}

    const mn=s.min??Math.min(...s.d),mx=s.max??Math.max(...s.d),r=(mx-mn)||1;
    const pts=s.d.map((v,i)=>`${(i/(s.d.length-1)*W).toFixed(1)},${(H-8-(v-mn)/r*(H-16)).toFixed(1)}`).join(' ');
    return`<polyline fill="none" stroke="${s.c}" stroke-width="2" ${s.dash?'stroke-dasharray="5 4"':''} points="${pts}"/>`}).join('')+'</svg>'+
    '<div class="sm mu">'+series.map(s=>`<span style="color:${s.c}">■</span> ${s.n}: ${f(s.d[s.d.length-1],s.dp??2)} (min ${f(Math.min(...s.d),s.dp??2)}, max ${f(Math.max(...s.d),s.dp??2)})`).join(' &nbsp; ')+'</div>';

const PK={sub:'cells',per:'day',ver:0,hist:{},busy:{},at:{},drawn:'',fr:{},sess:{},open:null,sp:0};
const dkey=t=>{const x=new Date(t);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const newDay=d=>({d,ahIn:0,ahOut:0,whIn:0,whOut:0,pkIn:0,pkOut:0,socMin:101,socMax:-1,socA:null,socB:null,tSum:0,tN:0,tMax:-99,dMax:0,cMin:1e9,cMax:0,sess:0,balS:0,alarms:0,n:0});

  if((c.balancing||[]).length)r.balS+=dt*3600;r.n++}

  for(let x=0;x<d.n;x++){const dk=dkey(d.t[x]),r=R[dk]||(R[dk]=newDay(dk)),I=d.i[x],V=d.v[x],c=d.cells[x]||[],dt=x&&d.t[x]-d.t[x-1]<=60000?(d.t[x]-d.t[x-1])/3.6e6:0;
    if(I>0){r.ahIn+=I*dt;r.whIn+=I*V*dt;r.pkIn=Math.max(r.pkIn,I);if(!chg)r.sess++}else if(I<0){r.ahOut-=I*dt;r.whOut-=I*V*dt;r.pkOut=Math.max(r.pkOut,-I)}
    chg=I>1;const s=d.soc[x];r.socMin=Math.min(r.socMin,s);r.socMax=Math.max(r.socMax,s);if(r.socA==null)r.socA=s;r.socB=s;
    const T=d.temp[x];if(T!=null){r.tSum+=T;r.tN++;r.tMax=Math.max(r.tMax,T)}
    if(c.length){const mn=Math.min(...c),mx=Math.max(...c);r.dMax=Math.max(r.dMax,mx-mn);r.cMin=Math.min(r.cMin,mn);r.cMax=Math.max(r.cMax,mx)}

    body=DBV.ev.map(r=>`<tr><td>${tm(r.t)}</td>${kc(r.label)}<td class="st ${r.ev==='raised'?r.sev:'healthy'}">${r.ev}</td><td>${r.title}</td><td class="${r.sev}">${r.sev}</td><td>${sr(r.src)}</td></tr>`).join('')}
  else{head='<th>Time</th><th>Kit</th><th>Samples</th><th>Avg V</th><th>Avg A</th><th>Avg power</th><th>Avg SoC</th><th>Max temp</th><th>Max imbalance</th><th>Source</th>';
    body=DBV.sum.slice(0,100).map(b=>`<tr><td>${tm(b.t)}</td>${kc(b.label)}<td>${b.n}</td><td>${f(b.v/b.n,2)} V</td><td>${f(b.i/b.n,2)} A</td><td>${Math.round(b.w/b.n)} W</td><td>${f(b.soc/b.n,0)} %</td><td>${b.T} °C</td><td>${b.d} mV</td><td>${sr(b.src)}</td></tr>`).join('')}
  const ids=[...new Set(DBV.sum.map(b=>b.kit))],ch=line(ids.map(id=>({n:K[id]?K[id].label:id,d:DBV.sum.filter(b=>b.kit===id).reverse().map(b=>b.w/b.n),c:css(COL[id]||'--tx'),dp:0})));
  const cols=head.split('<th>').length-1;
  return`<div class="c"><h2>Database</h2><div class="sm mu">Every kit is saved about every ${SAVE_EVERY/1000} s, plus every alarm raised or cleared. Data stays in this browser after you close the page and is deleted after ${RETAIN/864e5} days.</div></div>
  ${tb}<div class="g g6" style="margin-bottom:12px">${stats}</div>
  <div class="c"><h2>Average power in this view</h2><div class="sm mu">Positive = charging, negative = discharging.</div>${ch}</div>
  <div class="c"><h2>${{summary:'Summary (averages)',readings:'Latest 100 raw readings',events:'Alarm events (latest 200)'}[dbq.table]}</h2>
  <table><tr>${head}</tr>${body||`<tr><td colspan="${cols}" class="mu">No data stored for this selection yet.</td></tr>`}</table></div>`;
}

/* ============ render loop & events ============ */
function render(){
  $('#tabs').innerHTML=TABS.map(([id,l])=>`<button class="tab ${tab===id?'on':''}" data-a="tab" data-t="${id}">${l}${id==='alerts'&&ALARMS.length?`<span class="badge">${ALARMS.filter(a=>!a.ack).length}</span>`:''}</button>`).join('');
  const live=CFG.mode==='mqtt',ok=live?conn==='connected':true;
  $('#pill').innerHTML=`<span class="pill"><span class="dot ${ok?'on':'bad'}"></span>${live?'Live MQTT: '+conn:'Simulator running'}</span>`;
  if(tab==='db'){if(DBV.drawn===DBV.ver)return;DBV.drawn=DBV.ver}
  if(tab==='packs'){const key=[sel,PK.ver,PK.sub,PK.per,FR.ver,Object.keys(K).length,PK.sub==='history'&&!PK.open?Math.floor(Date.now()/5000):0,PK.open||'',PK.sp].join('/');
    if(PK.drawn===key){const g=$('#pkG');if(g){g.innerHTML=packGrid();if(PK.sub==='cells'){const b=$('#pkB');if(b)b.innerHTML=cellsView(K[sel]||Object.values(K)[0])}}return}
    PK.drawn=key;const ds=$('.hxw')||$('.ds'),sy=ds?ds.scrollTop:0,sx=ds?ds.scrollLeft:0;$('#view').innerHTML=vPacks();const n=$('.hxw')||$('.ds');if(n){n.scrollTop=sy;n.scrollLeft=sx}return}
  if(tab==='report'){const key=[FR.ver,sel,RP.page,FR.busy,Object.keys(K).length].join('/');if(RP.drawn===key)return;RP.drawn=key}
  $('#view').innerHTML={overview:vOverview,report:vReport,packs:vPacks,alerts:vAlerts,perf:vPerf,db:vDB}[tab]();
  if(tab==='report'&&RP.scroll){RP.scroll=false;const e=$('#rpf');if(e)e.scrollIntoView()}
}
document.addEventListener('change',e=>{const x=e.target.closest('[data-f]');if(x){dbq[x.dataset.f]=x.value;refreshDB()}});
document.addEventListener('change',e=>{if(e.target.dataset.rp){RP.page=+e.target.value;RP.scroll=true;render()}});
document.addEventListener('change',e=>{if(e.target.dataset.sp){PK.sp=+e.target.value;render()}});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='tab'){tab=b.dataset.t;if(tab==='db'){DBV.ver++;refreshDB()}if(tab==='packs'){PK.drawn=''}if(tab==='report'){RP.drawn=''}}
  else if(a==='rpg'){RP.page=+b.dataset.p;RP.scroll=true}
  else if(a==='rcsv'){reportCsv();return}
  else if(a==='print'){window.print();return}
  else if(a==='psub'){PK.sub=b.dataset.s}
  else if(a==='pper'){PK.per=b.dataset.s}
  else if(a==='hcsv'){histCsv();return}
  else if(a==='sopen'){PK.open=b.dataset.sid;PK.sp=0}
  else if(a==='sback'){PK.open=null}
  else if(a==='spg'){PK.sp=+b.dataset.p}
  else if(a==='sfcsv'){sessCsv();return}
  else if(a==='sel'){sel=b.dataset.k;PK.open=null}
  else if(a==='ack'){const x=ALARMS.find(z=>z.kit===b.dataset.k&&z.key===b.dataset.key);if(x)x.ack=true}
  else if(a==='inj'){inject(b.dataset.t,b.dataset.k)}
  else if(a==='reset'){Object.values(K).forEach(k=>{k.eIn=k.eOut=k.ahOut=k.peak=k.tSum=k.tN=0;k.first=Date.now()})}
  else if(a==='csv'){const r=['kit,time,voltage_v,current_a,power_w,soc_pct,temp_c,imbalance_mv'];
    Object.values(K).forEach(k=>k.h.forEach(x=>r.push([k.label,new Date(x.t).toISOString(),x.v,x.i,x.w,x.soc,x.T,x.d].join(','))));
    const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([r.join('\n')],{type:'text/csv'}));l.download='bhm-history.csv';l.click()}
  else if(a==='dbref'){refreshDB()}
  else if(a==='dbcsv'){exportDB()}
  else if(a==='dbclr'){clearDB()}
  render();
});
let tk=0;start();render();purge();
setInterval(()=>{Object.values(K).forEach(reconcile);tk++;if(tk%2===0)flush();if(tk%600===0)purge();if(tab==='db'&&tk%5===0)refreshDB();
  if(tk%60===0)loadHealth();if(tab==='report'&&FR.id&&!FR.play&&Date.now()-FR.at>60000)loadFrames(FR.id);if(tab==='packs'&&sel&&PK.hist[sel]&&Date.now()-(PK.at[sel]||0)>6e5)loadHist(sel);render()},1000);
addEventListener('beforeunload',flush);
</script>
</body>
