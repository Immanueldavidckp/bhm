# Mosquitto 2.x. Two listeners with their own security settings:
#   8883  TLS, client certificate + password, per-gateway ACL   (gateways, ingester)
#   9001  MQTT over WebSocket, read-only telemetry, no login     (browser dashboard)
#         NOT published on the host: reachable only inside the compose network, through the
#         dashboard's /mqtt proxy, which checks the dashboard login first.
per_listener_settings true
persistence true
persistence_location /mosquitto/data/
# A gateway back online uploads its whole store-and-forward backlog at once. With the default
# limit (1000 queued messages per client) the broker silently dropped part of such a burst on
# its way to the ingester. Allow a large backlog (about 3 days of 3 packs at 10 s); each
# message is under 1 KB.
max_queued_messages 100000
log_dest stdout
log_type error
log_type warning
log_type notice

listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
require_certificate true
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

listener 9001
protocol websockets
allow_anonymous true
acl_file /mosquitto/config/acl-ws
